<title>Coral Fizz</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGBgAAAABQABpfZFQAAAAABJRU5ErkJggg==">
<style>
/* Pulse Shift — Ocean Pop v4. All art is original CSS / SVG. Oddberry Studios. */
:root{--ink:#105370;--ink-dark:#064460;--white:#fffefa;--ocean:#32bad0;--ocean-deep:#147baf;--foam:#b3fff2;--shadow:#07537352;--gap:6px;--font:'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-width:300px;margin:0;overflow:hidden}
body{font:800 16px/1.3 var(--font);background:#55d3d5;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,#board:focus-visible{outline:3px solid #fff9b4;outline-offset:4px}
button:disabled{cursor:default;opacity:.43;filter:saturate(.35)}
svg{display:block}
.sea-scene{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse 65% 45% at 50% -4%,#eaffea7c 0,transparent 90%),linear-gradient(150deg,#76e1d7 0%,#4fd0d9 39%,#2ab2cd 70%,#178cb8 100%)}
.sea-scene:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 11% 21%,#f6ffef80,transparent 18%),radial-gradient(circle at 89% 12%,#fff9d86b,transparent 18%),radial-gradient(ellipse at 50% 53%,#5ce4d93d,transparent 62%)}
.sunwash{position:absolute;left:50%;top:-33vmax;transform:translateX(-50%);width:100vmax;height:78vmax;border-radius:50%;background:radial-gradient(circle,#d7fff988,transparent 65%);filter:blur(20px)}
.rays{position:absolute;inset:-30% -30% 0;background:repeating-conic-gradient(from -12deg at 50% 0%,transparent 0deg 9deg,#e5fff51a 10deg 14deg,transparent 15deg 30deg);opacity:.65}
.sea-floor{position:absolute;left:0;bottom:-1px;width:100%;height:37%;min-height:195px;filter:drop-shadow(0 -6px 18px #2789ae11)}
.bubble{position:absolute;border:2px solid #e9fffd80;border-radius:50%;box-shadow:inset 4px 6px 10px #e9ffff4a,0 2px 14px #0e75a91a;animation:bubbleUp 9s ease-in-out infinite alternate}
.bubble:after{content:'';position:absolute;top:18%;left:23%;width:23%;height:20%;border-radius:50%;background:#fff8}
.bubble-a{width:47px;height:47px;left:9%;top:22%}.bubble-b{width:19px;height:19px;left:23%;top:73%;animation-delay:-4s}.bubble-c{width:38px;height:38px;right:13%;top:32%;animation-delay:-2s}.bubble-d{width:13px;height:13px;right:23%;top:15%;animation-delay:-3s}.bubble-e{width:20px;height:20px;right:5%;bottom:13%;animation-delay:-6s}
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;min-height:0}
.topbar{height:58px;flex:none;width:min(1010px,calc(100% - 36px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;z-index:5}
.header-left{display:flex;align-items:center;gap:8px}
.nav-icon,.pause-button{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;color:#177a9f;background:linear-gradient(#ffffffed,#dcf8f1e8);border:2px solid #ffffffcc;box-shadow:0 4px 0 #1881a556,0 7px 13px #07547730,inset 0 2px 0 #fff;transition:transform .14s,filter .14s;flex:none}
.nav-icon svg,.pause-button svg{width:22px;height:22px}
.nav-icon:hover,.pause-button:hover{filter:brightness(1.055)}
.nav-icon:active,.pause-button:active{transform:translateY(3px);box-shadow:0 1px 0 #1881a556,0 3px 6px #07547730}
body[data-screen="menu"] #home-brand,body[data-screen="game"] #help-btn{display:none}
.screen{display:none;position:relative;width:100%;flex:1;min-height:0}
.screen.active{display:flex}
.screen--menu{flex-direction:column;align-items:center;justify-content:space-between}
.menu-content{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vh,17px);padding:0 18px}
.menu-logo{position:relative;z-index:3;text-align:center;flex:none;filter:drop-shadow(0 10px 8px #07678525)}
.menu-logo h1{position:relative;margin:0;display:flex;flex-direction:column;align-items:center;line-height:.83;font-size:clamp(65px,9.6vw,100px);letter-spacing:-.065em;font-weight:1000;transform:rotate(-2deg)}
.menu-logo h1 span{color:#fffcef;-webkit-text-stroke:3px #166c9a;text-shadow:0 3px 0 #97e7e9,0 6px 0 #0d628a,2px 9px 0 #0d628a,0 13px 10px #07466e4d}
.menu-logo h1 strong{position:relative;margin-top:4px;font-weight:1000;color:#ffdc62;-webkit-text-stroke:3px #126b99;text-shadow:0 3px 0 #fff3b8,0 7px 0 #e88b44,0 10px 0 #0b6694,0 15px 12px #095a814a}
.logo-spark{font-size:38px;position:absolute;z-index:2;color:#fff5af;text-shadow:0 2px #1779aa,0 0 10px #fdf7b4;line-height:1}
.spark-one{top:8%;left:-31px;transform:rotate(-15deg);animation:twinkle 3s ease-in-out infinite}
.spark-two{top:52%;right:-34px;transform:scale(.73) rotate(20deg);animation:twinkle 3s ease-in-out -1.2s infinite}
.menu-art{position:relative;display:grid;place-items:center;width:min(530px,95vw);height:clamp(210px,42vh,360px);flex:none;isolation:isolate}
.menu-halo{position:absolute;width:min(460px,98%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c7fff4aa 0%,#cdfce84d 37%,transparent 69%);filter:blur(2px)}
.orbit{position:absolute;border-radius:50%;border:2px solid #eafff16b;transform:rotate(-18deg)}
.orbit-first{width:65%;aspect-ratio:1;border-style:dashed;animation:orbit 45s linear infinite}
.orbit-second{width:87%;aspect-ratio:1;border-color:#e5fff545}
.preview-card{position:relative;z-index:2;height:min(320px,39vh);aspect-ratio:1;border-radius:34px;padding:9px;background:linear-gradient(145deg,#edfffb 3%,#b3e5ec 48%,#4daec6 100%);border:3px solid #efffff;box-shadow:0 10px 0 #1683a8,0 17px 0 #0b6c9280,0 25px 32px #075b8f78,inset 0 3px 3px #fff;transform:rotate(-9deg);animation:previewFloat 5s ease-in-out infinite}
.preview-card:before{content:'';position:absolute;inset:4px;border:1px solid #fff9;border-radius:29px;pointer-events:none}
.preview-ridge{width:100%;height:100%;padding:7px;border-radius:26px;background:linear-gradient(145deg,#20789f,#65b7c8);border:2px solid #e6fff7a1;box-shadow:inset 0 5px 14px #074e7a9a}
.preview-board{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:5px;min-width:0;min-height:0}
.scene-token{position:absolute;z-index:4;border-radius:29%;border:2px solid #ffffffa3;box-shadow:inset 0 6px 4px #fff9,inset 0 -5px #2a56852c,0 9px 0 #155c844b,0 13px 24px #075c8145;transform:rotate(20deg);animation:tokenFloat 4s ease-in-out infinite}
.scene-token:before{content:'';position:absolute;left:12%;right:12%;top:9%;height:36%;background:#fff7;border-radius:50% 50% 40% 40%}
.scene-token--pink{width:68px;height:68px;top:8%;left:6%;background:linear-gradient(145deg,#ffb6d2,#ed6895);transform:rotate(-19deg)}
.scene-token--gold{width:53px;height:53px;top:15%;right:6%;background:linear-gradient(145deg,#fff1ad,#ffc346);animation-delay:-1s}
.scene-token--blue{width:43px;height:43px;bottom:6%;left:8%;background:linear-gradient(145deg,#a0dcff,#4b9aff);animation-delay:-2s}
.menu-shine{position:absolute;color:#fffdf1;text-shadow:0 0 10px #fff;z-index:5;font-size:35px;line-height:1;animation:twinkle 3s ease-in-out infinite}
.shine-one{right:6%;bottom:22%}.shine-two{left:2%;top:39%;font-size:23px;animation-delay:-1.3s}
.primary-btn{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:16px;border-radius:22px;color:#7b430b;background:linear-gradient(180deg,#fff2a8 0%,#ffdc55 39%,#ffbc36 78%,#f5a72f 100%);border:3px solid #fff8bf;box-shadow:0 8px 0 #c77b2c,0 14px 0 #0e83a146,0 20px 25px #0b67895e,inset 0 3px 0 #fff7;min-height:61px;padding:0 30px;font-size:20px;font-weight:1000;letter-spacing:.055em;text-shadow:0 1px 1px #fff2b0;transition:transform .13s,box-shadow .13s,filter .13s}
.primary-btn:before{content:'';position:absolute;top:5px;left:9%;right:9%;height:39%;border-radius:50% 50% 42% 42%;background:linear-gradient(#fff8,#fff0);pointer-events:none;z-index:-1}
.primary-btn:after{content:'';position:absolute;top:-60%;left:-37%;width:25%;height:230%;background:#fff5;transform:rotate(25deg) translateX(-120px);animation:buttonShine 5s ease-in-out infinite;pointer-events:none}
.primary-btn svg{width:18px;height:18px;flex:none}
.primary-btn:hover{filter:brightness(1.065);transform:translateY(-2px)}
.primary-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c77b2c,0 5px 0 #0e83a146,0 8px 11px #0b67894b}
.menu-play{width:241px;min-height:65px;flex:none;z-index:6}
.menu-footer{flex:none;text-align:center;color:#e9ffffce;font-size:10px;font-weight:1000;letter-spacing:.26em;padding:9px 0 max(17px,env(safe-area-inset-bottom));text-shadow:0 1px 1px #116b92a0}
/* Compact, board-first gameplay. */
.screen--game{align-items:center;justify-content:center}
.game-shell{--board-size:min(calc(100vw - 38px),calc(100dvh - 264px),486px);max-height:100%;max-width:100%;min-height:0;width:calc(var(--board-size) + 10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,1.4vh,11px);padding-bottom:max(2px,env(safe-area-inset-bottom))}
.game-heading{width:var(--board-size);display:flex;align-items:center;justify-content:space-between;height:55px;min-height:0}
.level-tag{display:flex;align-items:baseline;gap:10px;line-height:1;filter:drop-shadow(0 2px 0 #9ee4e0a0)}
.level-tag span{font-size:13px;font-weight:1000;letter-spacing:.11em;color:#e8fffa;text-shadow:0 2px 2px #147f9d9e}
.level-tag strong{font-size:38px;font-weight:1000;letter-spacing:-.065em;color:#fffdf0;-webkit-text-stroke:1px #2b8c9c;text-shadow:0 3px 0 #167e9f,0 5px 8px #0759794a}
.heading-right{display:flex;align-items:center;gap:9px}
.moves-display{display:flex;align-items:center;gap:13px;height:48px;padding:0 14px 0 16px;border-radius:16px;border:2px solid #ffffffca;background:linear-gradient(160deg,#eafff5,#b8f1e9);box-shadow:0 5px 0 #1291ac78,0 8px 15px #0c739140,inset 0 2px #fff}
.moves-display span{font-size:10px;letter-spacing:.1em;color:#2e8295}
.moves-display strong{font-size:31px;letter-spacing:-.04em;font-weight:1000;color:#126e91;line-height:1}
.moves-display.critical strong{color:#e85f68;animation:criticalBeat .6s ease-in-out infinite alternate}
.pause-button{height:46px;width:46px;background:linear-gradient(#f4fff4,#b9ecf1);border-color:#e9fff4;box-shadow:0 5px 0 #0b779b6e,0 8px 14px #00678331}
.goal-ribbon{display:flex;align-items:center;justify-content:center;width:var(--board-size);height:54px;flex:none}
.goals-list{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.goal-item{height:50px;min-width:82px;max-width:139px;flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:5px 10px;border-radius:16px;border:2px solid #f7fff3db;background:linear-gradient(170deg,#f6fffd,#c4edf1);box-shadow:0 5px 0 #167d9e86,0 9px 13px #036a8d2c,inset 0 1px #fff;transition:transform .17s,filter .17s}
.goal-item.completed{filter:hue-rotate(12deg);background:linear-gradient(#e5fff0,#a4ecb8);transform:scale(.95)}
.mini-gem{width:34px;height:34px;display:grid;place-items:center;flex:none;position:relative;border:1px solid #fff8;border-radius:10px;background:linear-gradient(145deg,var(--tile-light),var(--tile-mid) 58%,var(--tile-dark));box-shadow:inset 0 3px 2px #fff9,inset 0 -4px #115d792e,0 3px 2px #1c718a48}
.mini-gem:before{content:'';position:absolute;top:8%;left:9%;right:9%;height:36%;border-radius:50%;background:linear-gradient(#fffb,#fff0)}
.mini-gem svg{position:relative;z-index:2;height:22px;width:22px;filter:drop-shadow(0 1px 2px #154e654b)}
.goal-score{font-size:23px;line-height:1;min-width:15px;text-align:center;font-weight:1000;color:#176b89}
.goal-item.completed .goal-score{color:#248e64}
.board-area{width:var(--board-size);flex:none}
.board-frame{aspect-ratio:1;position:relative;width:100%;padding:12px;border-radius:37px;background:linear-gradient(143deg,#fafff6 0%,#dbf9f4 40%,#92d6e1 74%,#5ab1cf 100%);border:3px solid #ecffff;box-shadow:0 10px 0 #127b9e,0 15px 0 #0a678c74,0 22px 33px #00608082,inset 0 4px #fff;transition:filter .15s}
.board-frame:before{content:'';position:absolute;inset:5px;border:1px solid #ffffffa8;border-radius:31px;pointer-events:none}
.board-frame:after{content:'';position:absolute;top:13px;left:16px;right:16px;height:12%;background:linear-gradient(#fff7,#fff0);border-radius:24px;pointer-events:none;z-index:1;opacity:.4}
.board{position:relative;overflow:hidden;touch-action:none;width:100%;height:100%;border-radius:25px;background:linear-gradient(155deg,#247f9f 0%,#1f81a7 43%,#1a729b 100%);border:3px solid #57a9bd;box-shadow:inset 0 5px 15px #05496bb5,inset 0 -2px 7px #a2ffff67}
.board:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff67 1.2px,transparent 1.4px);background-size:19px 19px;opacity:.26;pointer-events:none}
.board-inner,.fx-layer,.hint-layer{--n:5;--tile-gap:7px;position:absolute;inset:9px}
.board-inner{z-index:2}.fx-layer,.hint-layer{pointer-events:none;z-index:8}.hint-layer{z-index:9}
.tile,.preview-tile,.mini-gem{--tile-light:#ffb8a7;--tile-mid:#ff887c;--tile-dark:#dd546a;--tile-base:#b83c5c}
.tile{position:absolute;left:calc(var(--c) * 100% / var(--n) + var(--tile-gap) / 2);top:calc(var(--r) * 100% / var(--n) + var(--tile-gap) / 2);width:calc(100% / var(--n) - var(--tile-gap));height:calc(100% / var(--n) - var(--tile-gap));display:grid;place-items:center;overflow:hidden;border-radius:clamp(11px,2.25vw,20px);background:linear-gradient(143deg,var(--tile-light) 0%,var(--tile-mid) 57%,var(--tile-dark) 100%);border:1px solid #ffffffa8;box-shadow:inset 0 3px 1px #fff8,inset 0 -6px 1px #26374c2d,0 4px 0 var(--tile-base),0 6px 5px #06496a89;will-change:left,top;transition:left .22s cubic-bezier(.19,.89,.24,1),top .22s cubic-bezier(.19,.89,.24,1),transform .14s,filter .14s,opacity .14s}
.tile:before,.preview-tile:before{content:'';position:absolute;left:9%;right:9%;top:7%;height:38%;border-radius:48% 48% 34% 34%;background:linear-gradient(#fff9,#fff0);pointer-events:none}
.tile:after,.preview-tile:after{content:'';position:absolute;inset:5px;border-radius:inherit;border:1px solid #ffffff4e;pointer-events:none}
.tile svg{position:relative;z-index:1;width:56%;height:56%;filter:drop-shadow(0 3px 2px #0f437663)}
.tile.is-selected{transform:translate(calc(var(--drag-x,0) * 1px),calc(var(--drag-y,0) * 1px)) scale(1.028);transition:left .22s cubic-bezier(.19,.89,.24,1),top .22s cubic-bezier(.19,.89,.24,1),transform .035s linear,filter .1s;z-index:4;filter:brightness(1.13);box-shadow:inset 0 3px 1px #fff8,inset 0 -5px 1px #26374c2d,0 4px 0 var(--tile-base),0 9px 17px #033a6bb0}
.tile.newborn{animation:tileBorn .27s cubic-bezier(.19,1.25,.32,1) both}
.tile.bursting{z-index:7;animation:tileBurst .21s ease-in forwards}
.tile.hint-target{box-shadow:0 0 0 3px #ffe79e,0 0 18px #fff8ce,inset 0 3px #fff}
.preview-tile{position:relative;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;border-radius:clamp(7px,1vw,12px);border:1px solid #fff9;background:linear-gradient(148deg,var(--tile-light),var(--tile-mid) 60%,var(--tile-dark));box-shadow:inset 0 2px 1px #fffa,inset 0 -4px #153e7b35,0 3px 0 var(--tile-base),0 4px 2px #0b477b82}
.preview-tile svg{position:relative;z-index:1;width:57%;height:57%;filter:drop-shadow(0 2px 1px #0942696b)}
.tile--0,.preview-tile--0,.mini-gem--0{--tile-light:#ffcbc0;--tile-mid:#ff8d82;--tile-dark:#ed5d77;--tile-base:#ba4466}
.tile--1,.preview-tile--1,.mini-gem--1{--tile-light:#a6f8d6;--tile-mid:#50d7b4;--tile-dark:#22aa9d;--tile-base:#188f86}
.tile--2,.preview-tile--2,.mini-gem--2{--tile-light:#fff3af;--tile-mid:#ffd063;--tile-dark:#f5a73f;--tile-base:#c28234}
.tile--3,.preview-tile--3,.mini-gem--3{--tile-light:#ecd2ff;--tile-mid:#c19afa;--tile-dark:#8e6bdf;--tile-base:#7153ba}
.tile--4,.preview-tile--4,.mini-gem--4{--tile-light:#c6efff;--tile-mid:#7dc6fc;--tile-dark:#408de9;--tile-base:#2d70c3}
.tile--5,.preview-tile--5,.mini-gem--5{--tile-light:#ffcef2;--tile-mid:#f68ed0;--tile-dark:#d65cac;--tile-base:#ad468a}
.controls-bar{height:59px;width:var(--board-size);display:flex;align-items:center;gap:11px;flex:none;justify-content:space-between;margin-top:4px}
.pulse-zone{height:52px;flex:1;min-width:0;border-radius:17px;padding:0 12px;display:flex;align-items:center;gap:9px;background:linear-gradient(160deg,#effff6,#b8ecf1);border:2px solid #f3fff3;box-shadow:0 5px 0 #1885a3a0,0 10px 14px #04779732,inset 0 1px #fff}
.pulse-emblem{height:28px;width:28px;display:grid;place-items:center;color:#ffbb3f;filter:drop-shadow(0 2px 1px #ba78288c);flex:none}
.pulse-emblem svg{height:27px;width:27px}
.meter{position:relative;min-width:20px;flex:1;height:14px;border-radius:999px;background:#79b6c7;box-shadow:inset 0 2px 4px #0f5f8796;padding:3px;overflow:hidden;border:1px solid #e2ffff92}
.meter-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ffce60,#ffd95d 49%,#fff4ae);box-shadow:0 0 12px #ffe896aa,0 0 3px #fff4ac;transition:width .35s cubic-bezier(.2,.9,.25,1)}
.meter.pulse-high .meter-fill{animation:meterShine .55s alternate infinite}
.tools-row{display:flex;gap:8px;height:52px}
.tool-btn{height:52px;width:60px;border-radius:16px;background:linear-gradient(#f7fff4,#c9edf4);border:2px solid #eeffff;color:#19779f;box-shadow:0 5px 0 #1885a3a0,0 9px 12px #04779737,inset 0 2px #fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;transition:transform .12s,filter .12s}
.tool-btn svg{width:21px;height:21px}
.tool-btn small{font-weight:1000;font-size:9px;letter-spacing:.06em;margin-top:2px}
.tool-btn:not(:disabled):hover{filter:brightness(1.06)}
.tool-btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #1885a3a0,0 3px 5px #04779737}
.hidden-data{display:none!important}
/* Impact, cascades, hints, feedback */
.board-impact{animation:boardImpact .25s ease-out}
.combo-float{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;font-weight:1000;font-size:clamp(24px,4.5vw,38px);white-space:nowrap;color:#fff6bc;-webkit-text-stroke:2px #dc8640;text-shadow:0 4px 0 #c87846,0 9px 13px #08496e96;animation:comboRise .95s ease-out forwards}
.particle{width:8px;height:8px;position:absolute;border-radius:3px;background:var(--particle-color,#ffed9c);border:1px solid #fff9;box-shadow:0 0 8px var(--particle-color,#fff2b1);animation:particleBurst .64s ease-out forwards;z-index:10}
.pulse-beam{position:absolute;background:linear-gradient(90deg,transparent,#fffcbfc8 30%,#fff9dd 50%,#fffcbfc8 70%,transparent);filter:drop-shadow(0 0 12px #fff2a6);z-index:5;pointer-events:none;animation:pulseFlash .55s ease-out forwards}
.pulse-beam--h{left:0;right:0;height:calc(100% / var(--n));top:calc(var(--r) * 100% / var(--n))}
.pulse-beam--v{top:0;bottom:0;width:calc(100% / var(--n));left:calc(var(--c) * 100% / var(--n));background:linear-gradient(180deg,transparent,#fffec8c8 30%,#fff9dd 50%,#fffec8c8 70%,transparent)}

 openModal('win',{stars,level,score:game.state.score,combo:game.state.bestCombo,moves:game.config.moves-game.state.movesUsed});celebrate();
}
function loseLevel(){locked=true;stat('losses');recordRound(false);data.failures[game.config.level]=(data.failures[game.config.level]||0)+1;data.streak=0;data.session=null;persist();audio.fail();openModal('lose',{level:game.config.level,score:game.state.score});}
function celebrate(){const host=$('overlay');for(let i=0;i<32;i++){const piece=document.createElement('i');piece.className='celebration-piece';const colors=['#ffd18a','#f6a1b5','#9de9d7','#c6b0fe','#fff4d6','#8cbaf5'];piece.style.setProperty('--color',colors[i%colors.length]);piece.style.setProperty('--x',((i*57+23)%101)+'%');piece.style.setProperty('--w',(4+i%3*2)+'px');piece.style.setProperty('--h',(7+i%4*3)+'px');piece.style.setProperty('--wind',(-100+((i*93)%210))+'px');piece.style.setProperty('--spin',(280+((i*83)%620))+'deg');piece.style.setProperty('--dur',(1.8+(i%8)*.17)+'s');piece.style.setProperty('--delay',((i%9)*.075)+'s');host.appendChild(piece);setTimeout(()=>piece.remove(),3600);}}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);}
function closeModal(){modalType='';$('overlay').hidden=true;$('modal').innerHTML='';audio.setFocus('game');}
function goalImage(goal){return goal.kind==='pulse'?'✦':goal.kind==='clear'?glyph(4):glyph(goal.type);}
function openModal(type,details={}){
 modalType=type;if(!audio.ctx)audio.ensure();audio.setFocus(type);audio.click();const box=$('modal');$('overlay').hidden=false;
 box.dataset.kind=type;
 if(type==='win'){
   const art=(game?.config?.goals||[]).map(g=>`<div class="goals-review__item">${g.kind==='color'?glyph(g.type):`<span>${goalImage(g)}</span>`}</div>`).join('');
   const praise = details.stars===3 ? 'Perfect!' : details.stars===2 ? 'Great job!' : 'Nice work!';
   box.innerHTML=`<div class="star-rating">${Array.from({length:3},(_,i)=>`<span class="${i<details.stars?'earned':''}"><img src="${GEM_ASSETS[2]}" alt="" draggable="false"></span>`).join('')}</div><div class="win-ribbon">Level ${details.level}</div><div class="win-panel"><h2 id="modal-title">Level Complete!</h2><div class="win-subtitle">${praise}</div><div class="goals-review">${art}</div><div class="win-stats"><div class="win-stat"><small>Score</small><strong>${fmt(details.score)}</strong></div><div class="win-stat"><small>Best Chain</small><strong>${Math.max(1,details.combo||1)}x</strong></div><div class="win-stat"><small>Moves Left</small><strong>${Math.max(0,details.moves||0)}</strong></div></div><div class="win-actions"><button class="primary-btn" id="next-btn" type="button">▶ &nbsp; Next</button><button class="modal-secondary" id="win-home-btn" type="button">⌂ &nbsp; Home</button></div></div>`;
   $('next-btn').onclick=()=>{if(details.level>2&&details.level%3===0)window.PulseAds?.showInterstitial();enterLevel(details.level+1);};
   $('win-home-btn').onclick=showMenu;
 }else if(type==='lose'){
   box.innerHTML=`<button class="modal__close" id="modal-x" aria-label="Close">×</button><div class="modal__eyebrow">Level ${details.level}</div><h2 id="modal-title">Out of Moves</h2><div class="stacked-actions"><button class="primary-btn" id="retry-btn" type="button">↻ &nbsp; Retry</button><button class="modal-secondary" id="lose-home-btn" type="button">⌂ &nbsp; Home</button></div>`;
   $('retry-btn').onclick=()=>enterLevel(details.level);$('lose-home-btn').onclick=showMenu;$('modal-x').onclick=showMenu;
 }else if(type==='pause'){
   box.innerHTML=`<h2 id="modal-title">Paused</h2><div class="stacked-actions"><button class="primary-btn" id="resume-btn" type="button">▶ &nbsp; Resume</button><button class="modal-secondary" id="restart-btn" type="button">↻ &nbsp; Restart</button><button class="modal-secondary" id="pause-home-btn" type="button">⌂ &nbsp; Home</button></div>`;
   $('resume-btn').onclick=closeModal;$('restart-btn').onclick=()=>{enterLevel(game.config.level);};$('pause-home-btn').onclick=()=>{saveSession();showMenu();};
 }else if(type==='settings'){
   box.innerHTML=`<button class="modal__close" id="modal-x" aria-label="Close">×</button><h2 id="modal-title">Settings</h2><div class="option-list"><div class="option"><span>♫ &nbsp; Music</span><button id="music-toggle" class="toggle ${data.music?'on':''}" type="button" role="switch" aria-checked="${data.music}" aria-label="Background music"></button></div><div class="option"><span>◖)) &nbsp; Sound</span><button id="sfx-toggle" class="toggle ${data.sfx?'on':''}" type="button" role="switch" aria-checked="${data.sfx}" aria-label="Sound effects"></button></div><div class="settings-credit">Made by Oddberry Studios</div></div>`;
   $('modal-x').onclick=closeModal;
   $('sfx-toggle').onclick=()=>{data.sfx=!data.sfx;persist();$('sfx-toggle').classList.toggle('on',data.sfx);$('sfx-toggle').setAttribute('aria-checked',String(data.sfx));if(data.sfx){audio.pause(false);audio.ensure();audio.click();}};
   $('music-toggle').onclick=()=>{data.music=!data.music;persist();$('music-toggle').classList.toggle('on',data.music);$('music-toggle').setAttribute('aria-checked',String(data.music));if(data.music){audio.pause(false);audio.ensure();}audio.setFocus(modalType||'game');};
 }else if(type==='help'){
   const a=GEM_ASSETS;
   box.innerHTML=`<button class="modal__close" id="modal-x" aria-label="Close">×</button><h2 id="modal-title">How to Play</h2><div class="howto-grid"><div class="help-card"><div class="help-illustration"><img src="${a[3]}" alt=""><img src="${a[2]}" alt=""><img src="${a[1]}" alt=""></div><p>Swipe rows<br>or columns</p></div><div class="help-card"><div class="help-illustration"><img src="${a[0]}" alt=""><img src="${a[0]}" alt=""><img src="${a[0]}" alt=""></div><p>Match 3 or<br>more pieces</p></div><div class="help-card"><div class="help-illustration"><span class="help-mark">✦</span></div><p>Reach the<br>level goals</p></div></div><button class="primary-btn" id="help-close" type="button">Got it</button>`;
   $('modal-x').onclick=closeModal;$('help-close').onclick=()=>{closeModal();if(screen==='game')$('board').focus();};
 }else if(type==='start'){
   box.innerHTML=`<button class="modal__close" id="modal-x" aria-label="Close">×</button><div class="modal__eyebrow">Level ${details.level}</div><h2 id="modal-title">Collect these items</h2><div class="start-goals">${details.goals.map(g=>{const kind=g.kind||'color';return `<div class="start-goal"><div class="start-goal__icon ${kind}">${goalImage(g)}</div><div class="start-goal__count">${g.need}</div></div>`;}).join('')}</div><button class="primary-btn" id="start-level-btn" type="button">▶ &nbsp; Play</button>`;
   $('modal-x').onclick=closeModal;$('start-level-btn').onclick=()=>{closeModal();$('board').focus();};
 }
}

// Fits the full visual bounds of each popup, including stars and the close button.
function fitCoralModal(){
 const overlay=document.getElementById('overlay'), m=document.getElementById('modal');
 if(!overlay||overlay.hidden||!m||!m.children.length)return;
 m.style.setProperty('--cf-modal-fit','1');m.style.setProperty('--cf-modal-offset','0px');
 const vw=window.visualViewport?.width||innerWidth,vh=window.visualViewport?.height||innerHeight;
 const base=m.getBoundingClientRect(), stars=m.querySelector('.star-rating'),close=m.querySelector('.modal__close');
 let extraTop=0,extraBottom=0;
 for(const el of [stars,close])if(el){const rect=el.getBoundingClientRect();extraTop=Math.max(extraTop,base.top-rect.top);extraBottom=Math.max(extraBottom,rect.bottom-base.bottom);}
 const fit=Math.max(.25,Math.min(1,(vw-18)/Math.max(1,base.width),(vh-20)/Math.max(1,base.height+extraTop+extraBottom)));
 m.style.setProperty('--cf-modal-fit',String(fit));
 m.style.setProperty('--cf-modal-offset',String((extraTop-extraBottom)*fit/2)+'px');
}
const cfModalObserver=new MutationObserver(()=>requestAnimationFrame(fitCoralModal));
cfModalObserver.observe(document.getElementById('modal'),{childList:true});
window.addEventListener('resize',()=>requestAnimationFrame(fitCoralModal));
window.visualViewport?.addEventListener('resize',()=>requestAnimationFrame(fitCoralModal));
function showHelp(first=false){openModal('help',{first});}
function settings(){openModal('settings');}
// Wire up controls. All ad requests occur directly inside button gestures, outside gameplay.
$('play-btn').addEventListener('click',()=>{audio.pause(false);audio.ensure();const level=data.session?.level||data.progress||1;enterLevel(level,Boolean(data.session));});
$('help-btn').addEventListener('click',()=>showHelp());$('settings-btn').addEventListener('click',settings);
$('home-brand').addEventListener('click',()=>{if(game&&screen==='game'&&!(modalType==='win'||modalType==='lose'))saveSession();showMenu();});
$('pause-btn').addEventListener('click',()=>{if(game&&!locked)openModal('pause');});$('hint-btn').addEventListener('click',hint);$('undo-btn').addEventListener('click',undo);
const board=$('board');
board.addEventListener('pointerdown',e=>{
 if(!game||locked||modalType||adPaused||backgroundPaused)return;
 if(e.button!==undefined&&e.button!==0)return;
 const p=pointsToCell(e);
 gesture={id:e.pointerId,x:e.clientX,y:e.clientY,...p,axis:null};hover=p;
 try{board.setPointerCapture(e.pointerId);}catch(_){}
});
board.addEventListener('pointermove',e=>{
 if(!game)return;
 if(!gesture){hover=pointsToCell(e);return;}
 if(gesture.id!==e.pointerId)return;
 const g=gesture,dx=e.clientX-g.x,dy=e.clientY-g.y;
 if(!g.axis){
  if(Math.hypot(dx,dy)<7)return;
  createDragPreview(g,Math.abs(dx)>=Math.abs(dy)?'row':'col');
 }
 const distance=g.axis==='row'?dx:dy;
 paintDrag(g,dragWithResistance(distance,g.cell));
});
board.addEventListener('pointerup',e=>{
 if(!gesture||gesture.id!==e.pointerId)return;
 const g=gesture;gesture=null;
 if(!game||locked||modalType||adPaused){discardDrag(g);return;}
 if(!g.axis)return;
 const dx=e.clientX-g.x,dy=e.clientY-g.y;
 const total=g.axis==='row'?dx:dy;
 if(Math.abs(total)<Math.max(16,g.cell*.22)){
  returnWrappedDrag(g);return;
 }
 const move=g.axis==='row'?{dir:total<0?'left':'right',index:g.index}:{dir:total<0?'up':'down',index:g.index};
 commitMove(move,g);
});
board.addEventListener('pointercancel',e=>{
 if(!gesture||gesture.id!==e.pointerId)return;
 const g=gesture;gesture=null;returnWrappedDrag(g);
});
board.addEventListener('keydown',e=>{if(!game||locked||modalType||adPaused)return;const keyToDir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(keyToDir[e.key]){e.preventDefault();const dir=keyToDir[e.key];commitMove({dir,index:dir==='left'||dir==='right'?hover.r:hover.c});}});
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 if(modalType==='win'||modalType==='lose'){
   // Terminal cards must only be left through their explicit Next/Retry/Home actions.
   e.preventDefault();return;
 }
 if(modalType){e.preventDefault();closeModal();}
 else if(game&&screen==='game'&&!locked&&!backgroundPaused&&!adPaused){
   e.preventDefault();openModal('pause');
 }
});
document.addEventListener('visibilitychange',handleVisibilityChange);
window.addEventListener('pagehide',()=>{
 // Page exits do not resurrect completed/failed stages.
 if(game&&screen==='game'&&modalType!=='win'&&modalType!=='lose')saveSession();
});
window.addEventListener('pageshow',()=>{if(backgroundPaused!==document.hidden)handleVisibilityChange();});
window.addEventListener('pulse-ad-pause',()=>{adPaused=true;updateAudioPause();});
window.addEventListener('pulse-ad-resume',()=>{adPaused=false;releaseAnimationWaiters();pauseGameAfterInterruption();updateAudioPause();});
window.addEventListener('pulse-ad-error',()=>{adPaused=false;releaseAnimationWaiters();pauseGameAfterInterruption();updateAudioPause();});
// Boot; all screens and tile art are native HTML/CSS/SVG, no remote assets needed.
menuPreview();refreshMenu();showScreen('menu');
})();

</script>
